<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="4" fill="#0d1a0d"/>

  <!-- Torch glow (radial, warm orange) -->
  <radialGradient id="glow" cx="50%" cy="52%" r="45%">
    <stop offset="0%" stop-color="#ffb347" stop-opacity="0.85"/>
    <stop offset="40%" stop-color="#e05f00" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <rect width="32" height="32" rx="4" fill="url(#glow)"/>

  <!-- Background trees (darker, further away) -->
  <!-- Tree far left -->
  <polygon points="3,28 6,18 9,28" fill="#0f2a0f"/>
  <!-- Tree far right -->
  <polygon points="23,28 26,18 29,28" fill="#0f2a0f"/>

  <!-- Midground trees -->
  <!-- Tree left-mid -->
  <polygon points="0,28 4,14 8,28" fill="#163a16"/>
  <!-- Tree right-mid -->
  <polygon points="24,28 28,14 32,28" fill="#163a16"/>

  <!-- Foreground trees (darkest silhouettes) -->
  <!-- Tree left -->
  <polygon points="-1,32 5,10 11,32" fill="#1a4a1a"/>
  <!-- Tree right -->
  <polygon points="21,32 27,10 33,32" fill="#1a4a1a"/>

  <!-- Ground -->
  <rect x="0" y="27" width="32" height="5" fill="#0d1a0d"/>

  <!-- Torch flame -->
  <!-- Torch stick -->
  <rect x="15" y="20" width="2" height="6" rx="0.5" fill="#6b3a1f"/>
  <!-- Flame outer -->
  <ellipse cx="16" cy="19" rx="2.5" ry="3.5" fill="#e05f00" opacity="0.9"/>
  <!-- Flame inner -->
  <ellipse cx="16" cy="19.5" rx="1.4" ry="2.2" fill="#ffcc44" opacity="1"/>
  <!-- Flame tip -->
  <ellipse cx="16" cy="17.5" rx="0.7" ry="1.2" fill="#fff8cc" opacity="0.9"/>

  <!-- Player silhouette (tiny, below torch) -->
  <!-- body -->
  <rect x="15" y="25" width="2" height="3" rx="0.3" fill="#1a3a1a"/>
  <!-- head -->
  <circle cx="16" cy="24.5" r="1" fill="#1a3a1a"/>
</svg>
